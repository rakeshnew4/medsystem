<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow OPD Display</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173052 0,#07111f 55%)}.wrap{min-height:100vh;padding:28px 32px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.brand{font-size:30px;font-weight:800}.sub{color:#9fb0c7;margin-top:5px;font-size:15px}.clock{text-align:right}.time{font-size:28px;font-weight:750}.date{color:#9fb0c7}.grid{display:grid;grid-template-columns:1fr 1fr 2.2fr 1fr;gap:14px;flex:1;min-height:0}.panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;min-height:0;overflow:hidden}.panel h2{margin:0 0 14px;font-size:16px;color:#b9c8da;text-transform:uppercase;letter-spacing:1.2px}.tokens{display:flex;flex-direction:column;gap:9px}.token{font-size:29px;font-weight:800;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center}.token.current{background:#1fa463;color:#fff;box-shadow:0 0 24px rgba(31,164,99,.25)}.doctor{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.055);margin-bottom:9px}.doc-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.doc-name{font-weight:750;font-size:16px}.room{font-size:11px;color:#9fb0c7}.now{margin-top:7px;font-size:26px;font-weight:850}.next{margin-top:3px;color:#b9c8da;font-size:12px}.estimate{font-size:12px;color:#8de0b5;margin-top:5px}.empty{color:#71839c;font-size:14px;padding:18px 4px;text-align:center}.footer{margin-top:14px;background:#fff;color:#14213d;border-radius:18px;padding:13px 20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px}.footer strong{font-size:30px}.live{width:9px;height:9px;border-radius:50%;background:#27c77b;display:inline-block;box-shadow:0 0 12px #27c77b}@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.panel.doctors{grid-column:1/-1}.panel.upcoming{grid-column:1/-1}}@media(max-width:650px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.panel.doctors,.panel.upcoming{grid-column:auto}.brand{font-size:24px}.clock{display:none}.token{font-size:25px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand" id="hospital">CareFlow</div><div class="sub">OPD token status · <span class="live"></span> Live</div></div><div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date">--</div></div></header><section class="grid"><div class="panel"><h2>Queue</h2><div id="queue" class="tokens"></div></div><div class="panel"><h2>Vitals</h2><div id="vitals" class="tokens"></div></div><div class="panel doctors"><h2>Doctor Rooms</h2><div id="doctors"></div></div><div class="panel upcoming"><h2>Upcoming</h2><div id="upcoming" class="tokens"></div></div></section><footer class="footer" id="now">Loading live status…</footer></main><script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function clock(){const d=new Date();time.textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});date.textContent=d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"long",year:"numeric"})}setInterval(clock,1000);clock();
async function load(){try{const r=await fetch("/api/public-display",{cache:"no-store"}),x=await r.json();if(!r.ok)throw Error(x.error||"Unable to load display");hospital.textContent=x.hospital.name||"CareFlow";queue.innerHTML=x.queue.length?x.queue.map((t,i)=>'<div class="token '+(i===0?'current':'')+'">'+esc(t)+'</div>').join(""):'<div class="empty">No patients waiting</div>';vitals.innerHTML=x.vitals.length?x.vitals.map((t,i)=>'<div class="token '+(i===0?'current':'')+'">'+esc(t)+'</div>').join(""):'<div class="empty">No patients at vitals</div>';doctors.innerHTML=x.doctors.length?x.doctors.map(d=>'<div class="doctor"><div class="doc-head"><div class="doc-name">'+esc(d.name)+'</div><div class="room">'+esc(d.room||"Doctor Room")+'</div></div><div class="now">'+(d.current_token?'<span class="token current" style="display:inline-block;padding:5px 12px;font-size:22px">'+esc(d.current_token)+'</span>':'<span class="room">Waiting</span>')+'</div>'+(d.next_token?'<div class="next">Next · '+esc(d.next_token)+'</div>':'')+(d.estimated_wait?'<div class="estimate">Estimated · '+d.estimated_wait.min+'–'+d.estimated_wait.max+' min</div>':'')+'</div>').join(""):'<div class="empty">No doctor queues today</div>';upcoming.innerHTML=x.upcoming.length?x.upcoming.map(t=>'<div class="token" style="font-size:22px"><strong>'+esc(t.token)+'</strong><div style="font-size:11px;color:#9fb0c7;margin-top:2px">'+esc(t.doctor||"")+'</div></div>').join(""):'<div class="empty">No upcoming tokens</div>';const serving=x.doctors.find(d=>d.current_token);now.innerHTML=serving?'<span class="live"></span> NOW SERVING <strong>'+esc(serving.current_token)+'</strong><span>· '+esc(serving.name)+(serving.room?' · '+esc(serving.room):"")+'</span>':'<span class="live"></span> Waiting for the next patient';}catch(e){now.textContent=e.message}}load();setInterval(load,10000);
</script></body></html>
