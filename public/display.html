<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow Display</title>
<style>html,body{margin:0;height:100%;background:#081513;color:#fff;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:32px}.muted{opacity:.65;font-size:14px;margin-top:8px}</style>
</head>
<body><div class="box"><div style="font-size:28px;font-weight:800">CareFlow</div><div class="muted">Loading patient display…</div></div>
<script>
(async function(){
  try{
    const qs=new URLSearchParams(location.search);
    let code=qs.get('device');
    if(!code){
      const r=await fetch('/api/public-display?bootstrap=1',{cache:'no-store'});
      const x=await r.json();
      if(!r.ok||!x.device?.device_code) throw Error(x.error||'No enabled display is configured.');
      code=x.device.device_code;
    }
    location.replace('/display/?device='+encodeURIComponent(code));
  }catch(e){
    document.querySelector('.muted').textContent=e.message||'Unable to load display.';
  }
})();
</script></body></html>
