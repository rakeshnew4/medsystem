<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow Doctor Video</title><style>html,body{margin:0;height:100%;background:#0b1320;color:#fff;font-family:Inter,system-ui}#bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;background:#111c2c}#layout{height:calc(100vh - 58px);display:grid;grid-template-columns:330px 1fr}#meet{min-width:0;height:100%}#patientPanel{background:#fff;color:#172033;border-right:1px solid #243246;overflow:auto;padding:16px}.panelTitle{font-weight:900;font-size:15px;margin-bottom:12px}.card{border:1px solid #dfe5ea;border-radius:12px;padding:11px;margin-bottom:10px}.muted{font-size:11px;color:#667085}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #eef2f4;font-size:12px}.row:last-child{border-bottom:0}button{border:0;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer}@media(max-width:800px){#layout{grid-template-columns:1fr}#patientPanel{display:none}}</style></head><body><div id="bar"><div><strong id="title">CareFlow doctor video</strong><div id="meta" style="font-size:11px;opacity:.7"></div></div><div style="display:flex;gap:8px"><button onclick="openWorkspace()">Patient workspace</button><button onclick="leave()">End consultation</button></div></div><div id="layout"><aside id="patientPanel"><div class="panelTitle">Patient context</div><div id="patientData">Loading patient context…</div></aside><main id="meet"></main></div><script src="https://meet.jit.si/external_api.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('appointment_id');let api=null,appointment=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openWorkspace(){if(appointment?.patient_id)window.open('/?patient_id='+encodeURIComponent(appointment.patient_id),'_blank')}
function renderPatient(x){const c=x.clinical||{},v=c.vitals?.[0],visit=c.visits?.[0],lab=c.lab_orders?.[0],med=c.medications?.[0];patientData.innerHTML='<div class="card"><strong>'+esc(x.patient.name)+'</strong><div class="muted">'+esc(x.patient.uhid||'No UHID')+' · '+esc(x.patient.phone||appointment.patient_phone||'')+'</div></div>'+(v?'<div class="card"><strong>Latest vitals</strong><div class="row"><span>BP</span><span>'+esc(v.blood_pressure_systolic||'—')+'/'+esc(v.blood_pressure_diastolic||'—')+'</span></div><div class="row"><span>Pulse</span><span>'+esc(v.pulse||'—')+'</span></div><div class="row"><span>SpO₂</span><span>'+esc(v.spo2||'—')+'</span></div><div class="row"><span>Temp</span><span>'+esc(v.temperature||'—')+'</span></div></div>':'')+(visit?'<div class="card"><strong>Latest consultation</strong><div class="muted">'+esc(visit.doctor_name||'Doctor')+'</div><div style="font-size:12px;margin-top:6px">'+esc(visit.notes||visit.assessment||'No note recorded')+'</div></div>':'')+(lab?'<div class="card"><strong>Latest investigation</strong><div style="font-size:12px;margin-top:6px">'+esc(lab.test_name||lab.status||'Investigation')+' · '+esc(lab.status||'')+'</div></div>':'')+(med?'<div class="card"><strong>Latest medication</strong><div style="font-size:12px;margin-top:6px">'+esc(med.medicine_name||'Medication')+' · '+esc(med.dose||'')+' · '+esc(med.frequency||'')+'</div></div>':'')+'<div class="muted" style="margin-top:12px">Use Patient workspace for full history and clinical actions.</div>'}
async function start(){if(!id){meet.innerHTML='<div style="padding:30px">Appointment is missing.</div>';return}try{const r=await fetch('/api/opd/video-staff?appointment_id='+encodeURIComponent(id));const x=await r.json();if(!r.ok)throw Error(x.error);appointment=x.appointment;title.textContent=x.appointment.doctor_name+' · '+x.appointment.patient_name;meta.textContent=x.appointment.appointment_date+' · '+String(x.appointment.appointment_time).slice(0,5);await fetch('/api/opd/video-staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appointment_id:Number(id),action:'start'})});const wr=await fetch('/api/patient-workspace?patient_id='+encodeURIComponent(x.appointment.patient_id));const wx=await wr.json();if(wr.ok)renderPatient(wx);else patientData.innerHTML='<div class="card muted">Patient context unavailable.</div>';api=new JitsiMeetExternalAPI(x.video.domain,{roomName:x.video.room_name,parentNode:document.getElementById('meet'),width:'100%',height:'100%',userInfo:{displayName:x.appointment.doctor_name},configOverwrite:{prejoinConfig:{enabled:true},disableInviteFunctions:true},interfaceConfigOverwrite:{MOBILE_APP_PROMO:false}})}catch(e){meet.innerHTML='<div style="padding:30px">'+esc(e.message)+'</div>'}}
async function leave(){try{await fetch('/api/opd/video-staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appointment_id:Number(id),action:'end'})})}finally{if(api)api.dispose();location.href='/'}}start();
</script></body></html>
