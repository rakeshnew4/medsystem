<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow Doctor Video</title><style>html,body{margin:0;height:100%;background:#0b1320;color:#fff;font-family:Inter,system-ui}#bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;background:#111c2c}#meet{height:calc(100vh - 58px)}button{border:0;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer}</style></head><body><div id="bar"><div><strong id="title">CareFlow doctor video</strong><div id="meta" style="font-size:11px;opacity:.7"></div></div><button onclick="leave()">End consultation</button></div><div id="meet"></div><script src="https://meet.jit.si/external_api.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('appointment_id');let api=null;
async function start(){if(!id){meet.innerHTML='<div style="padding:30px">Appointment is missing.</div>';return}try{const r=await fetch('/api/opd/video-staff?appointment_id='+encodeURIComponent(id));const x=await r.json();if(!r.ok)throw Error(x.error);title.textContent=x.appointment.doctor_name+' · '+x.appointment.patient_name;meta.textContent=x.appointment.date+' · '+String(x.appointment.time).slice(0,5);await fetch('/api/opd/video-staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appointment_id:Number(id),action:'start'})});api=new JitsiMeetExternalAPI(x.video.domain,{roomName:x.video.room_name,parentNode:document.getElementById('meet'),width:'100%',height:'100%',userInfo:{displayName:x.appointment.doctor_name},configOverwrite:{prejoinConfig:{enabled:true},disableInviteFunctions:true},interfaceConfigOverwrite:{MOBILE_APP_PROMO:false}})}catch(e){meet.innerHTML='<div style="padding:30px">'+e.message+'</div>'}}
async function leave(){try{await fetch('/api/opd/video-staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appointment_id:Number(id),action:'end'})})}finally{if(api)api.dispose();location.href='/'}start();
</script></body></html>
