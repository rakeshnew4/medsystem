<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow OPD · Token</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f8f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:24px 16px}.brand{font-size:25px;font-weight:800;color:#0f766e}.subtitle{color:#667085;margin-top:3px}.card{background:#fff;border:1px solid #dfe8e7;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 6px 20px rgba(16,24,40,.05)}.muted{color:#667085}.error{background:#fff7f5;border:1px solid #fecdca;color:#912018;padding:16px;border-radius:12px;line-height:1.5}.error h2{margin:0 0 7px;font-size:20px;color:#7a271a}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 15px;border-radius:10px;border:1px solid #b7d6d1;background:#0f766e;color:#fff;text-decoration:none;font-weight:700}.btn.secondary{background:#fff;color:#0f766e}.token{font-size:48px;font-weight:900;color:#0f766e}.step{padding:10px 0;border-bottom:1px solid #edf1f0}@media(max-width:520px){.wrap{padding:18px 12px}.card{padding:18px}.token{font-size:42px}.actions{display:grid}.btn{width:100%;box-sizing:border-box}}</style></head><body><main class="wrap"><div class="brand">CareFlow</div><div class="subtitle">OPD token tracking</div><section class="card"><div id="app">Loading…</div></section></main><script>const qs=new URLSearchParams(location.search),token=qs.get('token');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const app=document.getElementById('app');function missing(){app.innerHTML='<div class="error"><h2>Your token link is missing</h2><div>We could not find an OPD token in this link. Open your appointment again or return to OPD booking to get a fresh token link.</div><div class="actions"><a class="btn" href="/opd/">Back to OPD</a><a class="btn secondary" href="/patient/">Open Patient Portal</a></div></div>'}async function load(){if(!token)return missing();try{const r=await fetch('/api/opd/token?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'Token could not be loaded');app.innerHTML='<div class="muted">'+esc(x.hospital.name)+'</div><div class="token">'+esc(x.token)+'</div><h2>'+esc(x.status.title)+'</h2><p>'+esc(x.status.next_action)+'</p><div class="step"><strong>Patients ahead:</strong> '+x.position.patients_ahead+'</div><div class="step"><strong>Estimated wait:</strong> '+x.position.estimated_wait.min+'–'+x.position.estimated_wait.max+' min</div><div style="margin-top:15px">'+x.journey.map(s=>'<div class="step"><strong>'+esc(s.label)+'</strong> · '+esc(s.status)+'</div>').join('')+'</div>'}catch(e){app.innerHTML='<div class="error"><h2>We could not load this token</h2><div>'+esc(e.message)+'</div><div class="actions"><button class="btn" type="button" onclick="load()">Retry</button><a class="btn secondary" href="/opd/">Back to OPD</a><a class="btn secondary" href="/patient/">Open Patient Portal</a></div></div>'}}load();setInterval(load,10000);</script></body></html>
