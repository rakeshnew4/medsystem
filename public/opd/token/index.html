<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow OPD · Token</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f8f8;color:#172033}.wrap{max-width:700px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dfe8e7;border-radius:18px;padding:22px;margin-top:16px}.muted{color:#667085}.error{background:#fff1f0;color:#b42318;padding:12px;border-radius:10px}.token{font-size:48px;font-weight:900;color:#0f766e}.step{padding:10px 0;border-bottom:1px solid #edf1f0}</style></head><body><main class="wrap"><strong style="font-size:25px;color:#0f766e">CareFlow</strong><div class="muted">OPD token tracking</div><section class="card"><div id="app">Loading…</div></section></main><script>const token=new URLSearchParams(location.search).get('token');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){if(!token)return app.innerHTML='<div class="error">Your token link is missing.</div>';try{const r=await fetch('/api/opd/token?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error);app.innerHTML='<div class="muted">'+esc(x.hospital.name)+'</div><div class="token">'+esc(x.token)+'</div><h2>'+esc(x.status.title)+'</h2><p>'+esc(x.status.next_action)+'</p><div class="step"><strong>Patients ahead:</strong> '+x.position.patients_ahead+'</div><div class="step"><strong>Estimated wait:</strong> '+x.position.estimated_wait.min+'–'+x.position.estimated_wait.max+' min</div><div style="margin-top:15px">'+x.journey.map(s=>'<div class="step"><strong>'+esc(s.label)+'</strong> · '+esc(s.status)+'</div>').join('')+'</div>'}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();setInterval(load,10000);</script></body></html>
