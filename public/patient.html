<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Appointment</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:700px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:24px;margin-top:16px}.muted{color:#667085}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef1f6;font-size:13px}.danger{background:#b42318;color:#fff;border:0;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.error{color:#b42318}.row{padding:10px 0;border-bottom:1px solid #edf0f4}</style></head><body><div class="wrap"><h1 id="hospital">My appointment</h1><div class="muted">CareFlow patient booking</div><div id="app" class="card">Loading...</div></div><script>
const token=new URLSearchParams(location.search).get("token"),API="/api";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){if(!token){app.innerHTML='<div class="error">Booking link is missing.</div>';return}try{const j=await fetch(API+"/public-appointment?token="+encodeURIComponent(token));const x=await j.json();if(!j.ok)throw Error(x.error);hospital.textContent=x.hospital_name||"My appointment";app.innerHTML='<h2>'+esc(x.doctor_name)+'</h2><span class="status">'+esc(x.status)+'</span><div class="row"><strong>Patient</strong><br>'+esc(x.patient_name)+'</div><div class="row"><strong>Date & time</strong><br>'+esc(x.appointment_date)+' · '+esc(x.appointment_time)+'</div><div class="row"><strong>Hospital</strong><br>'+esc(x.hospital_name)+'<br>'+esc(x.address||"")+(x.hospital_phone?'<br>'+esc(x.hospital_phone):"")+'</div>'+(x.status!=="cancelled"&&x.status!=="completed"&&x.status!=="no_show"?'<div style="margin-top:18px"><button class="danger" onclick="cancelBooking()">Cancel appointment</button></div>':"")}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function cancelBooking(){if(!confirm("Cancel this appointment?"))return;const r=await fetch(API+"/public-appointment",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,action:"cancel"})});const j=await r.json();if(!r.ok)return alert(j.error||"Could not cancel");load()}load();
</script></body></html>
