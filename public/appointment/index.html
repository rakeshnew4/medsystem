<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow Appointment</title><style>body{font-family:Arial,sans-serif;color:#172033;background:#fff;margin:0}.page{max-width:720px;margin:0 auto;padding:40px}.head{border-bottom:3px solid #0f766e;padding-bottom:18px;margin-bottom:24px}.brand{font-size:26px;font-weight:800;color:#0f766e}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border:1px solid #dfe8e7;border-radius:10px;padding:14px}.label{font-size:11px;color:#667085;text-transform:uppercase;font-weight:700}.value{font-size:17px;font-weight:700;margin-top:5px}.actions{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:11px 15px;background:#0f766e;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}@media print{.actions{display:none}.page{padding:10px}}@media(max-width:600px){.page{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div id="content">Loading appointment…</div></main><script>const token=new URLSearchParams(location.search).get('token');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function fmtDate(d){return d?new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}):''}async function load(){if(!token){content.innerHTML='<div class="head"><div class="brand">CareFlow</div></div><p class="muted">Appointment token missing. Please use the link from your booking confirmation.</p>';return}try{const r=await fetch('/api/opd/appointment?token='+encodeURIComponent(token));const x=await r.json();if(!r.ok)throw Error(x.error);const link=location.origin+'/appointment/?token='+encodeURIComponent(token);content.innerHTML='<div class="head"><div class="brand">'+esc(x.hospital_name||'CareFlow')+'</div><div class="muted">'+esc(x.address||'')+(x.hospital_phone?' · '+esc(x.hospital_phone):'')+'</div><h1>Appointment Confirmation</h1></div><div class="grid"><div class="item"><div class="label">Patient</div><div class="value">'+esc(x.patient_name)+'</div></div><div class="item"><div class="label">Doctor</div><div class="value">'+esc(x.doctor_name)+'</div><div class="muted">'+esc(x.specialty||'')+'</div></div><div class="item"><div class="label">Date</div><div class="value">'+esc(fmtDate(x.appointment_date))+'</div></div><div class="item"><div class="label">Time</div><div class="value">'+esc(String(x.appointment_time).slice(0,5))+'</div></div><div class="item"><div class="label">Consultation</div><div class="value">'+esc(x.consultation_type==='online'?'Online video':'In-person')+'</div></div><div class="item"><div class="label">Status</div><div class="value">'+esc(x.status)+'</div></div></div>'+(x.reason?'<div class="item" style="margin-top:14px"><div class="label">Reason / enquiry</div><div class="value">'+esc(x.reason)+'</div></div>':'')+'<div class="actions"><button class="btn" onclick="window.print()">Print</button><a class="btn" href="/api/opd/appointment-pdf?token='+encodeURIComponent(token)+'">Download PDF</a><button class="btn" onclick="shareWhatsApp()">WhatsApp</button><button class="btn" onclick="emailAppointment()">Email</button></div><p class="muted" style="margin-top:25px;font-size:12px">Keep this confirmation for your visit. Online consultation links are available from your patient portal when the consultation is ready.</p>';window._appointment={x,link}}catch(e){content.innerHTML='<div class="head"><div class="brand">CareFlow</div></div><p class="muted">'+esc(e.message)+'</p>'}}function shareWhatsApp(){const a=window._appointment;if(!a)return;const text='Appointment confirmed with '+a.x.doctor_name+' on '+fmtDate(a.x.appointment_date)+' at '+String(a.x.appointment_time).slice(0,5)+'. View appointment: '+a.link;location.href='https://wa.me/?text='+encodeURIComponent(text)}async function emailAppointment(){const a=window._appointment;if(!a)return;const email=prompt('Email address',a.x.patient_email||'');if(!email)return;try{const r=await fetch('/api/opd/appointment-send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,channel:'email',email})});const x=await r.json();if(!r.ok)throw Error(x.error);alert('Appointment link sent by email.')}catch(e){alert(e.message)}}load();</script></body></html>
