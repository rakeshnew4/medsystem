<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an Appointment</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:920px;margin:0 auto;padding:28px 16px}.brand{font-size:22px;font-weight:800}.muted{color:#687386}.card{background:white;border:1px solid #e4e8ef;border-radius:16px;padding:22px;box-shadow:0 5px 20px #00000008;margin-top:16px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{padding:7px 12px;border-radius:999px;background:#edf1f7;font-size:13px}.step.on{background:#172033;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit;background:white}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#172033;color:white}.secondary{background:#eef1f6;color:#172033}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.slot{background:#eef3ff;color:#20345f;min-height:44px}.slot.selected{background:#172033;color:#fff}.doctor{border:1px solid #e0e5ee;border-radius:12px;padding:14px;cursor:pointer}.doctor.selected{border:2px solid #172033}.hidden{display:none}.error{color:#b42318;margin-top:10px}.success{padding:16px;border-radius:12px;background:#ecfdf3;color:#146c43}.summary{line-height:1.7}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}.check input{width:auto;margin-top:3px}button{min-height:44px;touch-action:manipulation}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:16px}.slots{grid-template-columns:repeat(2,1fr)}button{width:100%}.doctor{padding:16px}.steps{gap:5px}.step{font-size:12px;padding:7px 9px}}</style></head><body><div class="wrap"><div class="brand" id="brand">CareFlow</div><div class="muted">Online appointment booking</div><div class="steps"><span class="step on" id="s1">1 Doctor</span><span class="step" id="s2">2 Time</span><span class="step" id="s3">3 Details</span><span class="step" id="s4">4 Confirm</span></div><div id="app" class="card">Loading...</div></div><script>
const API="/api";let hospital=null,doctors=[],doctor=null,date=new Date().toISOString().slice(0,10),time=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const api=async(p,o={})=>{const r=await fetch(API+p,{headers:{"Content-Type":"application/json"},...o});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j};
function steps(n){for(let i=1;i<=4;i++)document.getElementById("s"+i).classList.toggle("on",i===n)}
async function init(){try{const j=await api("/public-hospital");hospital=j.hospital;doctors=j.doctors;document.getElementById("brand").textContent=hospital?.name||"CareFlow";renderDoctors()}catch(e){document.getElementById("app").innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function renderDoctors(){steps(1);document.getElementById("app").innerHTML='<h2>Choose a doctor</h2><p class="muted">Select the doctor you want to see.</p><div class="grid">'+doctors.map(d=>'<div class="doctor" onclick="pickDoctor('+d.id+')"><strong>'+esc(d.name)+'</strong><div class="muted">'+esc(d.specialty||"General consultation")+'</div>'+(d.consultation_fee?'<div>₹'+esc(d.consultation_fee)+'</div>':"")+'</div>').join("")+'</div>'}
async function pickDoctor(id){doctor=doctors.find(x=>Number(x.id)===Number(id));await renderTimes()}
async function renderTimes(){steps(2);document.getElementById("app").innerHTML='<h2>'+esc(doctor.name)+'</h2><div class="grid"><div><label>Date</label><input id="date" type="date" min="'+new Date().toISOString().slice(0,10)+'" value="'+date+'" onchange="date=this.value;renderTimes()"></div></div><div id="slotbox">Loading slots...</div><button class="secondary" onclick="renderDoctors()">Back</button>';try{const j=await api("/public-slots?doctor_id="+doctor.id+"&date="+date);document.getElementById("slotbox").innerHTML=j.slots.length?'<p><strong>Available times</strong></p><div class="slots">'+j.slots.map(t=>'<button class="slot" onclick="pickTime(\''+t+'\')">'+t+'</button>').join("")+'</div>':'<p class="muted">No appointments are available on this date.</p>'}catch(e){document.getElementById("slotbox").innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function pickTime(t){time=t;renderDetails()}
function renderDetails(){steps(3);document.getElementById("app").innerHTML='<h2>Your details</h2><p class="muted">'+esc(doctor.name)+' · '+esc(date)+' · '+esc(time)+'</p><div class="grid"><div><label>Name *</label><input id="name" autocomplete="name"></div><div><label>Phone *</label><input id="phone" type="tel" autocomplete="tel"></div><div><label>Email</label><input id="email" type="email" autocomplete="email"></div><div><label>Reason for visit</label><input id="reason"></div></div><label class="check" style="margin-top:14px"><input id="wa" type="checkbox"><span>I agree to receive appointment-related WhatsApp messages on this number.</span></label><div style="margin-top:18px"><button class="secondary" onclick="renderTimes()">Back</button> <button onclick="confirmBooking()">Continue</button></div><div id="err" class="error"></div>'}
async function confirmBooking(){const b={name:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),email:document.getElementById("email").value.trim(),reason:document.getElementById("reason").value.trim(),whatsapp_opt_in:document.getElementById("wa").checked,doctor_id:doctor.id,appointment_date:date,appointment_time:time};if(!b.name||!b.phone)return document.getElementById("err").textContent="Name and phone are required.";try{const j=await api("/public-book",{method:"POST",body:JSON.stringify(b)});renderSuccess(j)}catch(e){document.getElementById("err").textContent=e.message}}
function renderSuccess(j){steps(4);const token=j.appointment.public_token;document.getElementById("app").innerHTML='<div class="success"><h2>Appointment requested</h2><div class="summary"><strong>'+esc(j.doctor.name)+'</strong><br>'+esc(j.appointment.appointment_date)+' at '+esc(j.appointment.appointment_time)+'<br>Status: '+esc(j.appointment.status)+'</div><p>Save this booking link to view or cancel the appointment:</p><a href="/patient.html?token='+encodeURIComponent(token)+'">Open my booking</a></div><div style="margin-top:16px"><button onclick="location.href=\'/book.html\'">Book another appointment</button></div>'}
init();
</script></body></html>
