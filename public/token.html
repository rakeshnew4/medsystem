<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>My CareFlow Visit</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152238;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:20px 15px 35px}.brand{font-weight:800;font-size:23px;color:#0f766e}.muted{color:#667085}.hero{background:#0f766e;color:#fff;border-radius:22px;padding:25px;margin-top:18px}.hero small{opacity:.8}.token{font-size:64px;line-height:1;font-weight:900;margin:9px 0}.status{font-size:18px;font-weight:750}.estimate{margin-top:18px;background:rgba(255,255,255,.12);border-radius:14px;padding:14px}.card{background:#fff;border:1px solid #e4e9ee;border-radius:18px;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #eef1f4}.row:last-child{border-bottom:0}.journey{display:flex;flex-direction:column;gap:0}.step{display:flex;gap:12px;min-height:43px}.dot{width:11px;height:11px;border-radius:50%;background:#d0d5dd;margin-top:5px;flex:none}.done .dot{background:#12b76a}.current .dot{background:#f79009;box-shadow:0 0 0 5px #fff3e0}.step strong{text-transform:capitalize}.step span{display:block;color:#667085;font-size:12px;margin-top:2px}.next{background:#effaf6;border:1px solid #b7ead1;color:#087443;border-radius:14px;padding:13px;margin-top:12px}.refresh{font-size:12px;color:#667085;text-align:center;margin-top:12px}.error{color:#b42318;background:#fff1f0;padding:14px;border-radius:12px;margin-top:15px}@media(max-width:420px){.token{font-size:52px}}
</style></head><body><main class="wrap"><div class="brand">CareFlow</div><div class="muted" id="hospital">Your OPD visit</div><div id="app"></div></main><script>
const token=new URLSearchParams(location.search).get("token");const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(x){const e=x.status;app.innerHTML='<section class="hero"><small>Your token</small><div class="token">'+esc(x.token)+'</div><div class="status">'+esc(e.title)+'</div><div style="margin-top:5px;opacity:.9">'+esc(x.doctor?.name||"Doctor to be assigned")+(x.doctor?.specialty?" · "+esc(x.doctor.specialty):"")+'</div><div class="estimate"><strong>'+(x.position.estimated_wait.min===0?"Your turn is now":x.position.estimated_wait.min+"–"+x.position.estimated_wait.max+" min")+'</strong><br><span style="opacity:.85">'+(x.position.patients_ahead?x.position.patients_ahead+" patient(s) ahead":"You are next / being served")+'</span></div></section><section class="card"><div class="row"><strong>Next</strong><span style="text-align:right">'+esc(e.next_action)+'</span></div><div class="row"><strong>Doctor</strong><span>'+esc(x.doctor?.name||"—")+(x.doctor?.room?"<br>"+esc(x.doctor.room):"")+'</span></div><div class="row"><strong>UHID</strong><span>'+esc(x.uhid||"—")+'</span></div></section><section class="card"><h3 style="margin-top:0">Your journey</h3><div class="journey">'+x.journey.map(s=>'<div class="step '+(s.status==="completed"?"done ":"")+(s.status==="current"?"current":"")+'"><div class="dot"></div><div><strong>'+esc(s.label)+'</strong><span>'+esc(s.status)+'</span></div></div>').join("")+'</div></section><div class="refresh">Live status refreshes automatically · '+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+'</div>'}
async function load(){if(!token){app.innerHTML='<div class="error">Your token tracking link is missing.</div>';return}try{const r=await fetch("/api/public-token?token="+encodeURIComponent(token),{cache:"no-store"}),x=await r.json();if(!r.ok)throw Error(x.error||"Unable to load visit");hospital.textContent=x.hospital.name||"Your OPD visit";render(x)}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();setInterval(load,10000);
</script></body></html>
