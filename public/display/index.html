<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareFlow Display</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;background:#081513;color:#fff;overflow:hidden}
#app{height:100vh;display:grid;grid-template-columns:50% 50%}
#tokens{padding:3vh 3vw;display:flex;flex-direction:column;min-width:0}
#ads{position:relative;min-width:0;background:#10221f;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #28423d;padding-bottom:1.5vh}
.hospital{font-size:clamp(22px,2.6vw,46px);font-weight:800}.location{opacity:.7;font-size:clamp(12px,1.2vw,20px)}
.now{margin:3vh 0 2vh;font-size:clamp(16px,1.5vw,25px);opacity:.75}.token{font-size:clamp(70px,10vw,180px);font-weight:900;line-height:.9;letter-spacing:.03em}
.room{font-size:clamp(20px,2vw,34px);margin-top:1.5vh}.doctor{opacity:.7;font-size:clamp(14px,1.3vw,22px);margin-top:.5vh}
.next-title{margin-top:auto;opacity:.65;font-size:clamp(14px,1.2vw,20px)}.next-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:1vh}.next{border:1px solid #31534c;border-radius:12px;padding:9px 14px;font-size:clamp(16px,1.5vw,25px)}
.ad{height:100%;width:100%;display:none;align-items:center;justify-content:center;text-align:center;padding:5vw;position:absolute;inset:0}.ad.active{display:flex}
.ad-content{max-width:90%;max-height:90%}.ad-title{font-size:clamp(30px,4vw,72px);font-weight:900}.ad-body{font-size:clamp(18px,2vw,34px);opacity:.8;margin-top:18px;line-height:1.35}.ad img{max-width:100%;max-height:75vh;object-fit:contain}.ad video{max-width:100%;max-height:80vh}.ad-credit{position:absolute;bottom:18px;left:0;right:0;opacity:.5;font-size:12px}
#footer{position:absolute;bottom:0;left:0;right:0;background:#050d0c;padding:10px 3vw;font-size:clamp(12px,1vw,18px);opacity:.8}
.empty{height:100%;display:grid;place-items:center;opacity:.45;font-size:24px}
</style></head>
<body><div id="app"><section id="tokens"><div class="header"><div><div class="hospital" id="hospital">CareFlow</div><div class="location" id="location"></div></div><div id="clock"></div></div><div id="tokenBody" style="flex:1;display:flex;flex-direction:column"></div></section><section id="ads"><div class="empty" id="adEmpty">Hospital advertisements</div><div id="adStage"></div></section></div><div id="footer">Please keep your token ready. Follow hospital staff instructions.</div>
<script>
const qs=new URLSearchParams(location.search),device=qs.get('device');let cfg=null,ads=[],adIndex=0,lastToken='';
const pretty=s=>String(s||'').replaceAll('_',' ');
async function load(){if(!device){document.body.innerHTML='<div class="empty">Display device code missing.</div>';return}try{const r=await fetch('/api/public-display?device='+encodeURIComponent(device));if(!r.ok)throw Error('Display unavailable');const d=await r.json();cfg=d.device;ads=d.ads||[];document.getElementById('hospital').textContent=cfg.hospital_name||'Hospital';document.getElementById('location').textContent=cfg.location||cfg.name;renderTokens(d.queue||[]);renderAds();applySplit()}catch(e){document.getElementById('tokenBody').innerHTML='<div class="empty">Display connection unavailable</div>'}}
function applySplit(){const t=Math.max(0,Math.min(100,Number(cfg?.token_percent??50)));document.getElementById('app').style.gridTemplateColumns=t+'% '+(100-t)+'%'}
function renderTokens(q){const active=q[0];const next=q.slice(1,4);const body=active?'<div class="now">NOW SERVING</div><div class="token">'+escapeHtml(active.token)+'</div><div class="room">'+escapeHtml(active.room||'Please proceed to consultation')</div><div class="doctor">'+escapeHtml(active.doctor_name||'')+'</div>':'<div class="empty">Please wait for the next token</div>';document.getElementById('tokenBody').innerHTML=body+(cfg?.show_next_tokens&&next.length?'<div class="next-title">NEXT</div><div class="next-list">'+next.map(x=>'<span class="next">'+escapeHtml(x.token)+'</span>').join('')+'</div>':'');if(cfg?.show_sound&&active&&active.token!==lastToken&&lastToken){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance('Token '+active.token+' please proceed '+(active.room||'to the consultation room')))}catch(e){}}lastToken=active?.token||''}
function renderAds(){const stage=document.getElementById('adStage'),empty=document.getElementById('adEmpty');if(!ads.length){empty.style.display='grid';stage.innerHTML='';return}empty.style.display='none';stage.innerHTML=ads.map((a,i)=>'<div class="ad '+(i===adIndex?'active':'')+'" data-id="'+a.id+'"><div class="ad-content">'+(a.media_type==='image'&&a.media_url?'<img src="'+escapeAttr(a.media_url)+'">':a.media_type==='video'&&a.media_url?'<video src="'+escapeAttr(a.media_url)+'" autoplay muted loop playsinline></video>':'<div class="ad-title">'+escapeHtml(a.title)+'</div><div class="ad-body">'+escapeHtml(a.body||'')+'</div>')+'<div class="ad-credit">'+escapeHtml(a.advertiser_name||'Advertisement')+'</div></div></div>').join('')}
function rotate(){if(!ads.length)return;const old=ads[adIndex];adIndex=(adIndex+1)%ads.length;document.querySelectorAll('.ad').forEach((x,i)=>x.classList.toggle('active',i===adIndex));if(old)fetch('/api/display-impression',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device,campaign_id:old.id,duration_seconds:Number(cfg?.ad_rotation_seconds||10)})}).catch(()=>{})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
let lastRotate=Date.now();setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),1000);setInterval(load,5000);setInterval(()=>{const ms=Math.max(3000,Number(cfg?.ad_rotation_seconds||10)*1000);if(Date.now()-lastRotate>=ms){lastRotate=Date.now();rotate()}},1000);load();
</script></body></html>
