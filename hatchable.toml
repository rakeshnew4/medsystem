[ai]
required = true

[auth]
enabled = true
providers = ["email"]

[[secret]]
name = "WHATSAPP_GRAPH_URL"
expose = true

[[secret]]
name = "WHATSAPP_ACCESS_TOKEN"
expose = true

[[secret]]
name = "WHATSAPP_PHONE_NUMBER_ID"
expose = true

[[secret]]
name = "WHATSAPP_VERIFY_TOKEN"
expose = true

[[secret]]
name = "GROQ_API_KEY"
expose = true

[[secret]]
name = "MSG91_AUTH_KEY"
expose = true
[[secret]]
name = "LITELLM_URL"
expose = true

[[secret]]
name = "LITELLM_API_KEY"
expose = true

[[secret]]
name = "LITELLM_MODEL"
expose = true

# Optional external Supabase PostgreSQL/Data API.
# When configured and enabled, CareFlow can use the external database adapter.
# When absent, the app continues using Hatchable's built-in PostgreSQL.
[[secret]]
name = "SUPABASE_URL"
expose = true

[[secret]]
name = "SUPABASE_SECRET_KEY"
expose = true

[[secret]]
name = "SUPABASE_ENABLED"
expose = true